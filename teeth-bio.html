<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1030">
<title>魔法牙齒偵測儀</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#8fd8ff;transition:background-color .8s;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#fff;
  }
  body.uv{background:#0b0830}
  body.done{background:#14306b}
  #app{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #cnt{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;display:none}
  #cnt b{font-size:22px;color:#9dff6b;margin-left:4px}
  #snd{pointer-events:auto;background:rgba(0,0,0,.35);border:0;color:#fff;font-size:20px;width:42px;height:42px;border-radius:50%}
  #brand{font-weight:900;font-size:18px;color:#0b3d66;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  body.uv #brand,body.done #brand{display:none}

  #panel{
    position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
    background:rgba(10,14,50,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:16px 18px 18px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  #ttl{margin:0 0 6px;font-size:23px;font-weight:900;line-height:1.25}
  #sub{margin:0 0 12px;font-size:15px;line-height:1.5;color:#d6defa}
  #btn{
    width:100%;border:0;border-radius:18px;padding:15px;font-size:20px;font-weight:900;color:#fff;
    background:linear-gradient(180deg,#42e695,#1fb870);box-shadow:0 5px 0 #138a52;font-family:inherit;
  }
  #btn:active{transform:translateY(4px);box-shadow:0 1px 0 #138a52}
  #btn.warn{background:linear-gradient(180deg,#ff9a56,#ff5f6d);box-shadow:0 5px 0 #b83a45}
  #btn.warn:active{box-shadow:0 1px 0 #b83a45}

  .bar{height:14px;border-radius:9px;overflow:hidden;position:relative;background:rgba(255,255,255,.18);margin:0 0 12px}
  #meterWrap{display:none;text-align:left;font-size:13px;color:#cdd6ff;margin-bottom:2px}
  #meterWrap .bar{background:linear-gradient(90deg,#3ddc84,#ffd23f,#ff4d4d);margin:4px 0 12px}
  #meter{position:absolute;top:0;bottom:0;right:0;width:100%;background:#1b2250;transition:width .3s}
  #opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:#cdd6ff}
  #opts label{display:flex;align-items:center;gap:6px}
  #opts input{width:18px;height:18px}
  #startRow{display:none;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 5px 0 #138a52;background:linear-gradient(180deg,#42e695,#1fb870)}
  #startRow button{flex:1;border:0;background:transparent;color:#fff;font-family:inherit;font-weight:900;font-size:19px;padding:27px 0;border-right:1px solid rgba(255,255,255,.18)}
  #startRow:after{content:'開始偵測！';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;pointer-events:none}
  #startRow button:last-child{border-right:0}
  #startRow button:active{background:rgba(0,0,0,.18)}
  #note{margin:10px 0 0;font-size:11px;color:#8d97c9}

  .say{
    position:absolute;transform:translate(-50%,-100%);background:#fff;color:#2b2150;font-weight:800;font-size:14px;
    padding:7px 11px;border-radius:14px;pointer-events:none;white-space:nowrap;animation:say 1.6s forwards;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }
  .say:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
  @keyframes say{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}15%{opacity:1;transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}
  #flash{position:absolute;inset:0;background:#ff2d55;opacity:0;pointer-events:none}
  #flash.on{animation:flash .9s}
  @keyframes flash{0%,40%,80%{opacity:.35}20%,60%,100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <video id="vid" playsinline muted></video>
  <div id="flash"></div>
  <div id="hud">
    <div id="brand">🦷 魔法牙齒偵測儀</div>
    <div id="cnt">🦠 細菌<b id="n">0</b></div>
    <button id="snd" aria-label="聲音">🔊</button>
  </div>
  <div id="panel">
    <h1 id="ttl"></h1>
    <p id="sub"></p>
    <div id="meterWrap">牙齒危險指數<div class="bar"><i id="meter"></i></div></div>
    <div id="opts">
      <label><input type="checkbox" id="optCam"> 用鏡頭照我的牙齒</label>
    </div>
    <div id="startRow"><button data-lv="clean" aria-label="開始偵測"></button><button data-lv="mid" aria-label="開始偵測"></button><button data-lv="bad" aria-label="開始偵測"></button></div>
    <button id="btn"></button>
    <p id="note">家長提示：這是模擬教具，不是真正的醫療儀器。（左／中／右按鈕＝乾淨／有些細菌／很多細菌，小孩看不出差別。）鏡頭畫面只在手機上即時顯示，不會上傳或儲存。</p>
  </div>
</div>

/* ---------- 尺寸與牙齒幾何 ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = app.clientWidth; H = app.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const th = Math.min(H * 0.5, W * 0.92 / 0.76), tw = th * 0.76, tx = (W - tw) / 2, ty = Math.max(62, H * 0.075);
  geo = { cx: W / 2, cy: ty + th / 2, tx, ty, tw, th };
}
window.addEventListener('resize', resize);

function base() { return Math.min(W, 480); }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function beep(f, d = 0.08, type = 'sine', v = 0.07) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = v;
  o.connect(g); g.connect(AC.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
}
function jingle(notes) { notes.forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .09), i * 130)); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
$('snd').onclick = () => { muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊'; };

/* ---------- 面板 ---------- */
function panel(t, s, b, fn, o) {
  $('ttl').innerHTML = t; $('sub').innerHTML = s;
  $('btn').style.display = b ? '' : 'none'; if (b) $('btn').textContent = b;
  act = fn || null;
  $('opts').style.display = o ? '' : 'none';
  $('note').style.display = o ? '' : 'none';
}
$('btn').onclick = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (act) act(); };

function setState(s) {
  state = s;
  document.body.className = (s === 'home') ? '' : (s === 'done' ? 'done' : 'uv');
  $('cnt').style.display = (s === 'home') ? 'none' : 'block';
  $('meterWrap').style.display = (s === 'result') ? 'block' : 'none';
  $('btn').classList.toggle('warn', s === 'result');
  $('startRow').style.display = (s === 'home') ? 'flex' : 'none';
}

/* ---------- 流程 ---------- */
function setTooth(name, instant) {
  if (name === toothName) return;
  fromName = toothName; toothName = name; fadeT = instant ? 1 : 0;
}
function goHome() {
  stopCam(); bugs = []; parts = []; total = 0; level = 'clean'; setTooth('clean', true);
  setState('home');
  panel('準備好檢查牙齒了嗎？', '這台儀器會發出<b>魔法藍光</b>，讓偷偷躲在牙齒上的細菌通通現形！', null, null, true);
}
async function startScan(lv) {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  scanKind = 'first'; level = lv; setTooth('clean', true);
  if ($('optCam').checked && !camOn) await startCam();
  beginScan(lv === 'clean' ? 0 : lv === 'mid' ? 10 + Math.floor(Math.random() * 5) : 36 + Math.floor(Math.random() * 6));
}
document.querySelectorAll('#startRow button').forEach(b => b.onclick = () => startScan(b.dataset.lv));
function beginScan(n) {
  spawnBugs(n);
  setState('scan'); scanStart = performance.now();
  panel('掃描中…', '魔法光正在照你的牙齒，<br>請張開嘴巴，不要動喔～', null);
  $('btn').classList.remove('warn');
}
function finishScan(now) {
  if (scanKind === 'first' && total > 0) {
    setState('result'); setTooth(level);
    const bad = level === 'bad';
    if (bad) bugs.forEach(b => { b.gnaw = true; b.showT = now; });
    panel(bad ? `😱 發現 ${total} 隻細菌！` : `😟 發現 ${total} 隻細菌！`,
      bad ? '牠們正在<b>啃你的牙齒</b>，牙齒好痛！<br>點點看牠們，聽聽牠們說什麼！<br><b>快去刷牙，刷完再按下面的按鈕！</b>' : '牠們躲在牙齒上，專門吃糖、準備把牙齒咬出洞洞。<br>點點看牠們，聽聽牠們說什麼！<br><b>快去刷牙，刷完再按下面的按鈕！</b>',
      '🪥 刷好牙了，重新偵測！', rescan);
    $('btn').classList.add('warn');
    $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
    buzz([200, 100, 200, 100, 300]);
    [0, 1, 2].forEach(i => setTimeout(() => beep(880, .12, 'square', .06), i * 220));
  } else {
    setState('done');
    const first = scanKind === 'first';
    panel(first ? '✨ 0 隻細菌！牙齒好乾淨！' : '✨ 0 隻細菌！牙齒閃亮亮！', '你是刷牙小英雄！⭐⭐⭐<br>每天早晚都要刷牙，細菌才不敢回來喔～', '再玩一次', goHome);
    confetti(); jingle([523, 659, 784, 1047]); buzz([100, 60, 100]);
  }
}
function rescan() {
  scanKind = 'again'; bugs = []; total = 0; setTooth('clean');
  beginScan(0);
}

/* ---------- 鏡頭 ---------- */
async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    vid.srcObject = stream; await vid.play(); camOn = true;
  } catch (e) { camOn = false; $('optCam').checked = false; say(W / 2, H * 0.2, '鏡頭打不開，改用卡通牙齒'); }
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; camOn = false; }

/* ---------- 細菌 ---------- */
function spawnBugs(n) {
  bugs = [];
  const { tx, ty, tw, th } = geo;
  for (let i = 0; i < n; i++) {
    let u, v;
    for (let tries = 0; tries < 30; tries++) {
      u = 0.06 + Math.random() * 0.88; v = 0.04 + Math.random() * 0.9;
      if (v > 0.62 && !((u > 0.14 && u < 0.4) || (u > 0.6 && u < 0.86))) continue;   // 牙根之間是空的
      if (level === 'mid' || Math.abs(u - 0.5) > 0.3 || v < 0.22 || v > 0.62 || Math.random() < 0.25) break;  // 盡量不遮住臉
    }
    bugs.push({ u: (tx + u * tw) / W, v: (ty + v * th) / H, r: 0.03 + Math.random() * 0.022, col: COLORS[(Math.random() * COLORS.length) | 0],
      ph: Math.random() * 6.28, dir: Math.random() < 0.5 ? 1 : -1, shown: false, showT: 0, dead: false, deadT: 0, shake: -1e9, gnaw: false });
  }
  total = n;
}
function crumb() {
  const g = bugs.filter(b => b.gnaw && b.shown && !b.dead); if (!g.length) return;
  const b = g[(Math.random() * g.length) | 0];
  parts.push({ k: 'pop', x: b.u * W, y: b.v * H, vx: (Math.random() - .5) * 80, vy: -40 - Math.random() * 40, life: .7, max: .7, r: 2 + Math.random() * 2, col: '#fff' });
}
function aliveShown() { return bugs.filter(b => b.shown && !b.dead).length; }
function drawBug(b, now) {
  let s = 1, alpha = 1;
  if (b.dead) { const a = (now - b.deadT) / 450; if (a >= 1) return; s = 1 - a; alpha = 1 - a; }
  else { const a = Math.min(1, (now - b.showT) / 300); s = a * (1.4 - 0.4 * a); }
  const t = now / 1000, r = b.r * base() * s;
  const sh = now - b.shake < 450 ? Math.sin((now - b.shake) / 25) * 5 : 0;
  const x = b.u * W + Math.sin(t * 2 + b.ph) * 3 + sh, y = b.v * H + Math.cos(t * 2.3 + b.ph) * 3;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  if (b.dead) ctx.rotate((now - b.deadT) / 60);
  ctx.shadowColor = b.col; ctx.shadowBlur = 16;
  ctx.strokeStyle = b.col; ctx.fillStyle = b.col; ctx.lineWidth = Math.max(1.5, r * 0.16); ctx.lineCap = 'round';
  for (let k = 0; k < 10; k++) {
    const a = k / 10 * 6.283 + t * 0.6 * b.dir, c = Math.cos(a), sn = Math.sin(a);
    ctx.beginPath(); ctx.moveTo(c * r * 0.9, sn * r * 0.9); ctx.lineTo(c * r * 1.35, sn * r * 1.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(c * r * 1.38, sn * r * 1.38, r * 0.14, 0, 6.283); ctx.fill();
  }
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = i / 28 * 6.283, rad = r * (1 + 0.08 * Math.sin(a * 3 + t * 3 + b.ph));
    const px = Math.cos(a) * rad, py = Math.sin(a) * rad; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * 1.1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, b.col); g.addColorStop(1, shade(b.col));
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  // 眼睛
  for (const ex of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex * r * 0.36, -r * 0.15, r * 0.25, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b1035'; ctx.beginPath(); ctx.arc(ex * r * 0.36 + Math.sin(t * 2 + b.ph) * r * .06, -r * 0.12, r * 0.12, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#1b1035'; ctx.lineWidth = Math.max(1.5, r * 0.1);
    ctx.beginPath(); ctx.moveTo(ex * r * 0.65, -r * 0.55); ctx.lineTo(ex * r * 0.12, -r * 0.38); ctx.stroke();
  }
  if (b.gnaw && !b.dead) {   // 啃咬：嘴巴一開一合
    const o = 0.15 + Math.abs(Math.sin(t * 7 + b.ph)) * 0.4;
    ctx.fillStyle = '#1b1035'; ctx.beginPath(); ctx.ellipse(0, r * .45, r * .42, r * o, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-r * .2, r * .45 - r * o, r * .13, r * .16); ctx.fillRect(r * .07, r * .45 - r * o, r * .13, r * .16);
  } else {
    ctx.strokeStyle = '#1b1035'; ctx.lineWidth = Math.max(1.5, r * 0.1);
    ctx.beginPath(); ctx.moveTo(-r * .4, r * .35);
    for (let i = 1; i <= 4; i++) ctx.lineTo(-r * .4 + i * r * .2, r * (i % 2 ? .5 : .32));
    ctx.stroke();
  }
  ctx.restore();
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${((n >> 16) & 255) * .45 | 0},${((n >> 8) & 255) * .45 | 0},${(n & 255) * .45 | 0})`;
}

/* ---------- 粒子 ---------- */
function confetti() {
  for (let i = 0; i < 140; i++) parts.push({ k: 'conf', x: W / 2, y: H * 0.3, vx: (Math.random() - .5) * 700, vy: -200 - Math.random() * 500,
    life: 3, max: 3, r: 4 + Math.random() * 5, col: `hsl(${Math.random() * 360},90%,60%)`, rot: Math.random() * 6 });
}
function sparkle() {
  const g = geo;
  parts.push({ k: 'spark', x: g.tx + g.tw * (0.1 + Math.random() * 0.8), y: g.ty + g.th * (0.05 + Math.random() * 0.9), vx: 0, vy: 0, life: .7, max: .7, r: 6 + Math.random() * 8 });
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'pop' || p.k === 'conf') p.vy += 500 * dt;
    if (p.k === 'foam') p.vy -= 20 * dt;
  }
  parts = parts.filter(p => p.life > 0);
}
function drawParts() {
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    ctx.save(); ctx.globalAlpha = a;
    if (p.k === 'foam') {
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.strokeStyle = '#bfe9ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); ctx.stroke();
    } else if (p.k === 'spark') {
      ctx.translate(p.x, p.y); ctx.rotate(1 - a); const r = p.r * (1 - Math.abs(a - .5)) * 1.6;
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff7a8'; ctx.shadowBlur = 10;
      ctx.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * .25 : r; const ang = i * Math.PI / 4; ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad); } ctx.fill();
    } else if (p.k === 'conf') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 6); ctx.fillStyle = p.col; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    } else {
      ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- 繪製 ---------- */
function drawTooth(now) {
  const { tx, ty, tw, th } = geo;
  const hurt = state === 'result' && level === 'bad' && aliveShown() > 0;
  const dx = hurt ? Math.sin(now / 35) * 2.5 : 0, dy = hurt ? Math.cos(now / 41) * 1.5 : 0;
  ctx.save(); ctx.translate(dx, dy);
  ctx.shadowColor = `rgba(130,210,255,${0.85 * uv})`; ctx.shadowBlur = 34 * uv;
  if (fadeT < 1) { ctx.globalAlpha = 1 - fadeT; ctx.drawImage(IMGS[fromName], tx, ty, tw, th); }
  ctx.globalAlpha = fadeT < 1 ? fadeT : 1; ctx.drawImage(IMGS[toothName], tx, ty, tw, th);
  ctx.restore();
}
function drawBites(now) {
  for (const b of bugs) {
    if (!b.gnaw || !b.shown) continue;
    let a = 1; if (b.dead) { a = 1 - (now - b.deadT) / 900; if (a <= 0) continue; }
    const g = Math.min(1, (now - b.showT) / 2500), r = b.r * base() * (0.8 + 0.5 * g);
    ctx.save(); ctx.globalAlpha = a * (0.4 + 0.5 * g);
    ctx.fillStyle = '#5b2f10'; ctx.beginPath(); ctx.arc(b.u * W, b.v * H, r, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function drawCam() {
  const vw = vid.videoWidth || 640, vh = vid.videoHeight || 480, s = Math.max(W / vw, H / vh);
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(vid, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s); ctx.restore();
}
function update(now, dt) {
  if (state === 'scan') {
    const p = (now - scanStart) / SCAN_MS, bx = p * W;
    for (const b of bugs) if (!b.shown && b.u * W < bx) {
      b.shown = true; b.showT = now;
      if (now - lastBeep > 70) { beep(700 + Math.random() * 600, .06, 'square', .035); lastBeep = now; }
    }
    if (now - lastBeep > 140) { beep(300 + p * 500, .05, 'sine', .04); lastBeep = now; }
    if (p >= 1) { for (const b of bugs) if (!b.shown) { b.shown = true; b.showT = now; } finishScan(now); }
  } else if (state === 'result') {
    if (level === 'bad' && Math.random() < 0.25) crumb();
  } else if (state === 'done') {
    if (now - lastSpark > 90) { sparkle(); lastSpark = now; }
  } else if (state === 'home') {
    if (now - lastSpark > 400) { sparkle(); lastSpark = now; }
  }
  updateParts(dt);
  const shown = aliveShown();
  $('n').textContent = shown;
  const ratio = total ? shown / total : 0;
  $('meter').style.width = ((1 - ratio) * 100) + '%';
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  const target = (state === 'home' || state === 'done') ? 0 : 1;
  uv += (target - uv) * 0.06; if (fadeT < 1) fadeT = Math.min(1, fadeT + 0.02);
  const camShow = camOn && state !== 'home';
  if (camShow) drawCam(); else { drawTooth(now); drawBites(now); }
  if (camShow) {
    ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(geo.cx, geo.cy, geo.tw * 0.62, geo.th * 0.56, 0, 0, 6.283); ctx.stroke(); ctx.restore();
  }
  if (camShow && uv > 0.01) { ctx.fillStyle = `rgba(25,10,110,${0.5 * uv})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'scan') {
    const p = (now - scanStart) / SCAN_MS, bx = Math.min(1, p) * W;
    const g = ctx.createLinearGradient(bx - 90, 0, bx, 0);
    g.addColorStop(0, 'rgba(120,200,255,0)'); g.addColorStop(1, 'rgba(120,220,255,.55)');
    ctx.fillStyle = g; ctx.fillRect(bx - 90, 0, 90, H);
    ctx.fillStyle = '#d8f6ff'; ctx.shadowColor = '#59d9ff'; ctx.shadowBlur = 18; ctx.fillRect(bx - 2, 0, 3, H); ctx.shadowBlur = 0;
  }
  for (const b of bugs) if (b.shown) drawBug(b, now);
  drawParts();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(now, dt); draw(now);
}

/* ---------- 點細菌 ---------- */
function say(x, y, text) {
  const d = document.createElement('div'); d.className = 'say'; d.textContent = text;
  d.style.left = Math.max(80, Math.min(W - 80, x)) + 'px'; d.style.top = y + 'px';
  app.appendChild(d); setTimeout(() => d.remove(), 1700);
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'result') return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const b of bugs) { if (!b.shown || b.dead) continue; const d = Math.hypot(b.u * W - x, b.v * H - y); if (d < bd) { bd = d; best = b; } }
  if (best && bd < best.r * base() * 1.9) {
    best.shake = performance.now();
    say(best.u * W, best.v * H - best.r * base() * 1.6, TAUNTS[(Math.random() * TAUNTS.length) | 0]);
    beep(180, .18, 'sawtooth', .05); buzz(40);
  }
});

/* ---------- 啟動 ---------- */
resize(); goHome(); requestAnimationFrame(frame);
</script>
</body>
</html>
